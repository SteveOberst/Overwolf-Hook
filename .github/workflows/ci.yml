name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Python for recorder tests
        run: python --version
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 -B build/ci "-DOWH_BUILD_NUMBER=$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify architecture and configured product links
        run: python tests/architecture_tests.py --build-dir build/ci
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }}
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure --output-junit test-results.xml
      - name: Build and test JVM artifacts
        shell: pwsh
        run: |
          $jvmBuild = "$PWD/build/ci/jvm/${{ matrix.configuration }}"
          ./jvm/gradlew.bat -p jvm check assemble --project-cache-dir "$jvmBuild/.gradle" "-PowhBuildDirectory=$jvmBuild" "-PnativeDirectory=$PWD/build/ci/native/${{ matrix.configuration }}" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify direct Java FFM consumers
        shell: pwsh
        run: |
          $native = "$PWD/build/ci/native/${{ matrix.configuration }}"
          $env:PATH = "$native;$env:PATH"
          $fixture = "$PWD/build/ci/tests/${{ matrix.configuration }}/owh_state_tests.exe"
          & $fixture jvm "$env:JAVA_HOME/bin/java.exe" "$PWD/tests/ffm/java/FfmStateRead.java" "$native/owh_client.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fixture jvm "$env:JAVA_HOME/bin/java.exe" "$PWD/tests/ffm/java/FfmChannels.java" "$native/owh_client.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" --enable-native-access=ALL-UNNAMED "$PWD/tests/ffm/java/FfmRoundtrip.java" "$native/owh_client.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify external JVM artifact consumers
        shell: pwsh
        run: |
          $version = (Get-Content version.txt).Trim()
          $jvmBuild = "$PWD/build/ci/jvm/${{ matrix.configuration }}"
          $jar = "$jvmBuild/libs/overwolf-hook-$version-abi-windows-x64.jar"
          ./jvm/gradlew.bat -p jvm publish --project-cache-dir "$jvmBuild/.gradle" "-PowhBuildDirectory=$jvmBuild" "-PnativeDirectory=$PWD/build/ci/native/${{ matrix.configuration }}" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $repository = "$jvmBuild/repository"
          ./jvm/gradlew.bat -p tests/consumers/kotlin installDist "-PsdkVersion=$version" "-PsdkRepository=$repository" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./jvm/gradlew.bat -p tests/consumers/java installDist "-PsdkVersion=$version" "-PsdkRepository=$repository" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD/build/ci/native/${{ matrix.configuration }};$env:PATH"
          ./build/ci/tests/${{ matrix.configuration }}/owh_state_tests.exe jvm-library "$env:JAVA_HOME/bin/java.exe" "$PWD/tests/consumers/kotlin/build/install/owh-kotlin-consumer-fixture/lib/*" ConsumerSmokeKt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ci/tests/${{ matrix.configuration }}/owh_state_tests.exe jvm-library "$env:JAVA_HOME/bin/java.exe" "$PWD/tests/consumers/java/build/install/owh-java-consumer-fixture/lib/*" ConsumerSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ci/tests/${{ matrix.configuration }}/owh_state_tests.exe jvm-library "$env:JAVA_HOME/bin/java.exe" "$jar;$jvmBuild/classes/java/test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed Native SDK consumers
        shell: pwsh
        run: |
          cmake --install build/ci --config ${{ matrix.configuration }} --prefix out/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/package_tests.py out/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/consumers/native -B build/consumer -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/out/install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/consumer --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/consumer -C ${{ matrix.configuration }} --output-on-failure
      - name: Package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          cpack --config build/ci/CPackConfig.cmake -C Release -B out/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem out/packages -Filter '*.zip'
          if (@($zip).Count -ne 1) { throw 'Expected exactly one package' }
          $version = (Get-Content version.txt).Trim()
          Get-ChildItem "build/ci/jvm/Release/repository/v$version" -File | Where-Object { $_.Extension -in '.jar', '.xml' } | Copy-Item -Destination out/packages/
          $lines = Get-ChildItem out/packages -File | Where-Object { $_.Extension -in '.zip', '.jar', '.xml' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath out/packages/SHA256SUMS -Value $lines -Encoding ascii
      - name: Compile published documentation examples
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          python tools/docs/smoke.py --sdk-dir out/install --ivy-repository build/ci/jvm/Release/repository --work-dir build/docs-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.configuration == 'Release'
        with:
          name: windows-x64
          path: |
            out/packages/*.zip
            out/packages/*.jar
            out/packages/*.ivy.xml
            out/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.configuration }}
          path: |
            build/ci/test-results.xml
            build/ci/jvm/${{ matrix.configuration }}/test-results/test/*.xml
            build/docs-smoke/report.json
          if-no-files-found: warn
