name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Python for recorder tests
        run: python --version
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON -DOWH_HOOK_TESTS=ON -DOWH_FFM_TESTS=ON -DOWH_JVM_BINDINGS=ON
          "-DJava_JAVA_EXECUTABLE=$env:JAVA_HOME/bin/java.exe"
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }}
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure --output-junit test-results.xml
      - name: Compile the Kotlin examples against the actual JVM artifact
        shell: pwsh
        run: |
          $version = (Get-Content version.txt).Trim()
          $jar = "$PWD/build/ci/jvm/java/${{ matrix.configuration }}/overwolf-hook-$version-windows-x64.jar"
          $repository = "$PWD/build/kotlin-test-repository"
          $release = New-Item -ItemType Directory -Force -Path "$repository/v$version"
          Copy-Item -LiteralPath $jar -Destination $release.FullName
          ./examples/kotlin/gradlew.bat -p jvm/kotlin check publish "-I$PWD/tests/kotlin_source_build.init.gradle" "-DoverwolfHookTestRepository=$repository" "-PowhCaptureDll=$PWD/build/ci/${{ matrix.configuration }}/owh_capture.dll" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "jvm/kotlin/build/repository/v$version" -File | Where-Object { $_.Extension -in '.jar', '.xml' } | Copy-Item -Destination $release.FullName
          ./examples/kotlin/gradlew.bat -p examples/kotlin installDist "-PoverwolfHookVersion=$version" "-I$PWD/tests/kotlin_source_build.init.gradle" "-DoverwolfHookTestRepository=$repository" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ci/${{ matrix.configuration }}/owh_state_tests.exe jvm-library "$env:JAVA_HOME/bin/java.exe" "$PWD/examples/kotlin/build/install/overwolf-hook-kotlin-example/lib/*" ReadStateKt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ci/${{ matrix.configuration }}/owh_state_tests.exe jvm-library "$env:JAVA_HOME/bin/java.exe" "$jar;$PWD/build/ci/jvm/java/${{ matrix.configuration }}/test-classes" ReadState
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the installed C example
        shell: pwsh
        run: |
          cmake --install build/ci --config ${{ matrix.configuration }} --prefix out/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S examples/c -B build/example -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/out/install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/example --config ${{ matrix.configuration }}
      - name: Package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          cpack --config build/ci/CPackConfig.cmake -C Release -B out/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem out/packages -Filter '*.zip'
          if (@($zip).Count -ne 1) { throw 'Expected exactly one package' }
          Copy-Item build/ci/jvm/java/Release/*.jar out/packages/
          $version = (Get-Content version.txt).Trim()
          Get-ChildItem "jvm/kotlin/build/repository/v$version" -File | Where-Object { $_.Extension -in '.jar', '.xml' } | Copy-Item -Destination out/packages/
          $lines = Get-ChildItem out/packages -File | Where-Object { $_.Extension -in '.zip', '.jar', '.xml' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath out/packages/SHA256SUMS -Value $lines -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.configuration == 'Release'
        with:
          name: windows-x64
          path: |
            out/packages/*.zip
            out/packages/*.jar
            out/packages/*.ivy.xml
            out/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.configuration }}
          path: |
            build/ci/test-results.xml
            jvm/kotlin/build/test-results/test/*.xml
          if-no-files-found: warn
