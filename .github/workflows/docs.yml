name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'starters/**'
      - 'tools/docs/**'
      - 'include/**'
      - 'cmake/public-headers.txt'
      - 'jvm/**'
      - 'modules/**'
      - 'tools/bindings/**'
      - 'zensical.toml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'version.txt'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit or release tag to build
        required: true
        type: string
      release_tag:
        description: Published SDK tag; must match the selected source version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Explicit source commit or tag for this documentation update
        required: true
        default: main
        type: string
      release_tag:
        description: Published SDK tag documented by this source, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the pinned documentation toolchain
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Validate the published release context
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -c 'import os,pathlib; assert os.environ["RELEASE_TAG"] == "v" + pathlib.Path("version.txt").read_text().strip(), "Release tag and source version differ"'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Only a published stable release can update the stable docs") else . end'
      - name: Build and check the site
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python tools/docs/build.py build --source-ref "$SOURCE_REF" --release-tag "$RELEASE_TAG"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: build/docs/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
