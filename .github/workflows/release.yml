name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Explicit
      # dispatch starts ordinary read-only CI without a PAT or pull_request_target.
      - name: Test the release PR
        if: steps.release.outputs.prs_created == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          foreach ($pr in ($env:RELEASE_PRS | ConvertFrom-Json)) {
            gh workflow run ci.yml --repo $env:GITHUB_REPOSITORY --ref $pr.headBranchName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.release_created == 'true'
        with:
          name: windows-x64
          path: out/packages
      - name: Attach the tested package
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          VERIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$release_sha" = "$VERIFIED_SHA"
          test -f "out/packages/overwolf-hook-${RELEASE_TAG#v}-windows-x64.zip"
          test -f "out/packages/overwolf-hook-${RELEASE_TAG#v}-windows-x64.jar"
          cd out/packages
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.zip ./*.jar SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
