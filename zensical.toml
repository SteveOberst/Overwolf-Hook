[project]
site_name = "Overwolf Hook"
site_description = "Overwolf game data and overlays in your native or JVM app, without an Overwolf developer account or approved platform app. Requires the Overwolf client."
site_url = "https://SteveOberst.github.io/Overwolf-Hook/"
repo_url = "https://github.com/SteveOberst/Overwolf-Hook"
repo_name = "GitHub"
docs_dir = "docs"
exclude_docs = "/assets/integration/"
watch = ["version.txt", "starters", "tools/docs/macros.py"]
site_dir = "build/docs/site"
extra_css = ["assets/stylesheets/docs.css"]

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Install the SDK" = "getting-started/installation.md" },
    { "Connections and lifetime" = "reference/contracts.md" },
    { "How it works" = "architecture.md" },
  ] },
  { "Features" = [
    { "Game events" = [
      { "Subscribe and receive events" = "game-events/index.md" },
      { "Event data and delivery" = "game-events/data-model.md" },
    ] },
    { "Overlays" = [
      { "Overview" = "overlays/index.md" },
      { "First overlay" = "overlays/first-overlay.md" },
      { "Pixel-buffer submission" = "overlays/pixel-buffers.md" },
      { "Shared-texture binding" = "overlays/shared-textures.md" },
    ] },
    { "Game state" = "game-state/reading-state.md" },
    { "Overwolf" = "overwolf.md" },
  ] },
  { "Reference" = [
    { "SDK APIs" = [
      { "C ABI" = [
        { "Operation index" = "reference/native-api.md" },
        { "SDK connection" = "reference/c/sdk.md" },
        { "Overwolf management" = "reference/c/overwolf.md" },
        { "Overlays and submissions" = "reference/c/overlays.md" },
        { "Events" = "reference/c/events.md" },
        { "Game state" = "reference/c/game-state.md" },
        { "Waits and cancellation" = "reference/c/wait.md" },
      ] },
      { "C++" = "reference/cpp-api.md" },
      { "Java" = "reference/java-api.md" },
      { "Kotlin" = "reference/kotlin-api.md" },
    ] },
    { "Data records" = "reference/data-records.md" },
    { "Constants and flags" = "reference/constants.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Project" = [
    { "SDK internals" = "development/internals.md" },
    { "Contributing" = "https://github.com/SteveOberst/Overwolf-Hook/blob/main/CONTRIBUTING.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
font = false
features = ["navigation.sections", "navigation.path", "navigation.top", "content.code.copy", "content.tabs.link", "search.highlight", "toc.follow"]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.zensical.extensions.macros]
module_name = "tools/docs/macros"
render_by_default = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
# Native, theme-aware Mermaid rendering: https://zensical.org/docs/authoring/diagrams/
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.snippets]
dedent_subsections = true
base_path = ["."]
check_paths = true
url_download = false
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
title = "On this page"

[project.plugins.redirects.redirect_maps]
"overlays/cpu-images.md" = "overlays/pixel-buffers.md"
"game-events/receiving-events.md" = "game-events/index.md"
"game-state/index.md" = "game-state/reading-state.md"

[project.validation]
invalid_links = "warn"
invalid_link_anchors = "warn"
